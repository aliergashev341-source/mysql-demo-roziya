<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MySQL demo — Roziya</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.5rem; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input { flex: 1; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 10px 16px; font-size: 1rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  li { padding: 8px 0; border-bottom: 1px solid #eee; list-style: none; }
  ul { padding: 0; }
  small { color: #888; }
  #err { color: #b91c1c; }
</style>
</head>
<body>
  <h1>Ismlar ro'yxati (MySQL) — Roziya</h1>
  <form id="f">
    <input id="name" placeholder="Ismingizni yozing" maxlength="100" required>
    <button type="submit">Saqlash</button>
  </form>
  <p id="err"></p>
  <ul id="list"></ul>
<script>
const API = "/.netlify/functions/api";
const list = document.getElementById("list");
const err = document.getElementById("err");

function render(rows) {
  if (!Array.isArray(rows)) { err.textContent = rows.error || "Xato"; return; }
  err.textContent = "";
  list.innerHTML = "";
  rows.forEach(r => {
    const li = document.createElement("li");
    li.textContent = r.name + " ";
    const s = document.createElement("small");
    s.textContent = new Date(r.created_at).toLocaleString();
    li.appendChild(s);
    list.appendChild(li);
  });
}

async function load() {
  const res = await fetch(API);
  render(await res.json());
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const input = document.getElementById("name");
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: input.value })
  });
  render(await res.json());
  input.value = "";
});

load();
</script>
</body>
</html>
